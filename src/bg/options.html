<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/tabmenu.css">
    <link rel="stylesheet" href="css/checkbox.css">
    <link rel="stylesheet" href="css/scriptlist.css">
    <link rel="stylesheet" href="css/options.css">
    <title data-i18n="optTitle">Online Dictionary Helper</title>
</head>

<body>
    <div class='container'>

        <div class="tabmenus">
            <a href="#" data-contentid="tab-1" class="tabmenu active" data-i18n="tabExtensionTitle">General</a>
            <a href="#" data-contentid="tab-2" class="tabmenu" data-i18n="tabServicesTitle">Anki</a>
            <!-- Hidden for now: Scripts tab -->
            <a href="#" data-contentid="tab-3" class="tabmenu" data-i18n="tabScriptsTitle" style="display:none">Scripts</a>
        </div>

        <form>
            <div id="tab-1" class="tabcontent">

                <div class="grouppanel">
                    <div class="grouptitle">
                        <span data-i18n="grpGeneral">General Options</span>
                        <span class="option-helps"> <a href="https://github.com/zland1851/FlashDict/blob/master/README.md" target="_blank">?</a> </span>
                    </div>
                    <div class="form-section">
                        <div class="toggle-row">
                            <label data-i18n="lblEnabled">Extension Enabled</label>
                            <div class="enabled">
                                <input type="checkbox" value=true id="enabled">
                                <label for="enabled"></label>
                            </div>
                        </div>
                        <div class="toggle-row">
                            <label data-i18n="lblMouseselection">Mouse Selection</label>
                            <div class="enabled">
                                <input type="checkbox" value=true id="mouseselection">
                                <label for="mouseselection"></label>
                            </div>
                        </div>
                        <div class="toggle-row">
                            <label data-i18n="lblHotkey">Selection Hotkey</label>
                            <select id="hotkey">
                                <option value="0">Off</option>
                                <option value="16">Shift</option>
                                <option value="17">Ctrl</option>
                                <option value="18">Alt</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="grouppanel">
                    <div class="grouptitle">
                        <span data-i18n="grpDictionary">Dictionary Options</span>
                    </div>
                    
                    <div class="grid-2-col">
                        <label for="dict" data-i18n="lblCurrentDict">Dictionary</label>
                        <select id="dict">
                            <option value="encn-Default">encn-Default</option>
                        </select>
                    </div>

                    <div class="grid-cols">
                        <div class="col-panel">
                            <div class="section-title">Behaviors</div>
                            <label data-i18n="lblLingualType">Mono/Bilingual Dict.</label>
                            <select id="monolingual">
                                <option value="0" data-i18n="selBilingual">Bilingual</option>
                                <option value="1" data-i18n="selMonolingual">Monolingual</option>
                            </select>
                            <label data-i18n="lblAudioPref">Pref. Audio</label>
                            <select id="anki-preferred-audio">
                                <option value="0" data-i18n="lblAudioPref0">#0</option>
                                <option value="1" data-i18n="lblAudioPref1">#1</option>
                            </select>
                        </div>
                        <div class="col-panel">
                            <div class="section-title">Content Limits</div>
                            <label data-i18n="lblMaxContext">Max. Context #</label>
                            <select id="maxcontext">
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                            </select>
                            <label data-i18n="lblMaxExample">Max. Example #</label>
                            <select id="maxexample">
                                <option value="0">0</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            
            <div id="tab-2" class="tabcontent" style="display:none">
                <div class="grouppanel anki-panel">
                    <div class="grouptitle">
                        <span data-i18n="grpAnki">Anki Options</span>
                        <span class="option-helps"> <a href="https://git.sr.ht/~foosoft/anki-connect" target="_blank">?</a> </span>
                    </div>

                    <div class="form-section">
                        <div class="form-row">
                            <label data-i18n="lblServices">Data Export</label>
                            <select id="services">
                                <option value="none">None</option>
                                <option value="ankiconnect">AnkiConnect</option>
                                <option value="ankiweb">AnkiWeb</option>
                            </select>
                        </div>
                        <div class="status-row">
                            <span id="services-status" class="status-badge">Not Connected</span>
                        </div>
                    </div>

                    <div id="user-options" class="form-section">
                        <div class="form-row">
                            <label data-i18n="lblUsername">Username</label>
                            <input type="text" id="id" placeholder="Enter your AnkiWeb username">
                        </div>
                        <div class="form-row">
                            <label data-i18n="lblPassword">Password</label>
                            <input type="password" id="password" placeholder="Enter your AnkiWeb password">
                        </div>
                        <div class="button-row">
                            <button type="button" class="btn btn-primary" id="login" data-i18n="lblSignin">Sign In</button>
                            <a href="https://ankiweb.net/account/register" target="_blank" class="link-signup" data-i18n="lblSignup">Create Account</a>
                        </div>
                    </div>

                    <div id="anki-options" class="form-section">
                        <div class="section-title">Card Settings</div>
                        <div class="form-grid">
                            <div class="form-row">
                                <label data-i18n="lblDeckname">Deck</label>
                                <select id="deckname"></select>
                            </div>
                            <div class="form-row">
                                <label data-i18n="lblTypename">Note Type</label>
                                <select id="typename"></select>
                            </div>
                        </div>

                        <div class="section-title">Field Mapping</div>
                        <div class="form-grid">
                            <div class="form-row">
                                <label for="expression" data-i18n="lblExpression">Expression</label>
                                <select id="expression"></select>
                            </div>
                            <div class="form-row">
                                <label for="reading" data-i18n="lblReading">Reading</label>
                                <select id="reading"></select>
                            </div>
                            <div class="form-row">
                                <label for="definition" data-i18n="lblDefinition">Definition</label>
                                <select id="definition"></select>
                            </div>
                            <div class="form-row">
                                <label for="definitions" data-i18n="lblDefinitions">Definitions</label>
                                <select id="definitions"></select>
                            </div>
                            <div class="form-row">
                                <label for="sentence" data-i18n="lblSentence">Sentence</label>
                                <select id="sentence"></select>
                            </div>
                            <div class="form-row">
                                <label for="extrainfo" data-i18n="lblExtrainfo">Extra Info</label>
                                <select id="extrainfo"></select>
                            </div>
                            <div class="form-row">
                                <label for="url" data-i18n="lblUrl">URL</label>
                                <select id="url"></select>
                            </div>
                            <div class="form-row">
                                <label for="audio" data-i18n="lblAudio">Audio</label>
                                <select id="audio"></select>
                            </div>
                        </div>

                        <div class="section-title">Additional Options</div>
                        <div class="form-grid">
                            <div class="form-row">
                                <label data-i18n="lblTags">Tags</label>
                                <input type="text" id="tags" placeholder="FlashDict">
                            </div>
                            <div class="form-row" id="duplicate-option">
                                <label data-i18n="lblAllowDuplicate">Duplicates</label>
                                <select id="duplicate">
                                    <option value="0" data-i18n="selNotAllowed">Not Allowed</option>
                                    <option value="1" data-i18n="selAllowed">Allowed</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div id="tab-3" class="tabcontent" style="display:none">
                <div class="grouppanel">
                    <div class="grouptitle">
                        <span data-i18n="grpUdfScripts">User-Defined Script</span>
                        <span class="option-helps"><a href="https://github.com/zland1851/FlashDict/blob/master/doc/development.md" target="_blank">?</a></span>
                    </div>
                    <div class="grid-2-col">
                        <label data-i18n="lblUdfScripts">UDF Scripts Name</label>
                        <input type="text" id="udfscripts" placeholder="http(s)://your_host.com/your_script.js">
                    </div>
                </div>
                <div class="grouppanel">
                    <div class="grouptitle">
                        <span data-i18n="grpSysScripts">System Script</span>
                        <span class="option-helps"><a id="hidden" href="#">…</a></span>
                    </div>
                    <div class="grid-2-col" style="display:none">
                        <label data-i18n="lblSysScripts">SYS Scripts Name</label>
                        <input type="text" id="sysscripts" placeholder="System Scripts">
                    </div>
                    <div class="grid-2-col col-3x" style="display:block">
                        <div id="scriptslisthead" class="sl-head">
                            <span class="sl-col sl-col-onoff" data-i18n="lstOnoff">OnOff</span><span class="sl-col sl-col-cloud hidden" data-i18n="lstCloud">Cloud</span><span class="sl-col sl-col-name" data-i18n="lstName">Script Name</span><span class="sl-col sl-col-description" data-i18n="lstDescription">Script Description</span>
                        </div>
                        <div class="scriptlistwrapper">
                            <div id="scriptslistbody" class="sl-body"></div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
        
        <div class="footer-panel">
            <div class="gifs">
                <span class="gif" id="gif-load"><img src="/fg/img/load.gif" alt=""></span>
                <span class="gif" id="gif-good"><img src="/fg/img/good.png" alt=""></span>
                <span class="gif" id="gif-fail"><img src="/fg/img/fail.png" alt=""></span>
            </div>
            <!-- Hidden load button kept for potential logic -->
            <label class="button" id="saveload" data-i18n="btnSaveLoad" style="display:none">Save and Load</label>
            
            <label class="button" id="saveclose" data-i18n="btnSaveClose">Save and Close</label>
            <label class="button" id="close" data-i18n="btnClose">Close</label>
        </div>
    </div>

    <!--script src="js/polyfill.js"></script-->
    <script src="../lib/jquery-3.7.1.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/tabmenu.js"></script>
    <script src="js/options.js"></script>
</body>

</html>
